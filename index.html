<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
    <title>Fake Store</title>
  </head>
  <body>
    <header className="lg:flex items-center justify-between px-15 px-4 lg:px-15 py-4 bg-[#060608]">
      <div classNameName="mb-4 md:mb-0">
        <input onkeyup="pesquisarProdutos(event.target.value)"
          type="text"
          placeholder="Digite o nome do produto"
          className="w-full lg:w-120 h-10 rounded bg-white pl-4"
        />
      </div>
      <div classNameName="flex gap-4 *:w-full lg:*:w-auto">
        <select id="categorias" onchange="filtrarPorCategoria(event.target.value)" className="h-10 rounded bg-white pl-4">
          <option selected disabled>Filtrar produtos</option>
          <option>All</option>
          <option>Men's clothing</option>
          <option>Women's clothing</option>
          <option>Electronics</option>
          <option>Jewelery</option>
        </select>
        <select id="ordenacao" onchange="ordenarProdutos(event.target.value)" className="h-10 rounded bg-white pl-4">
          <option selected disabled>Ordenar produtos</option>
          <option value="maiorPreco">Ordenar por maior preço</option>
          <option value="menorPreco">Ordenar por menor preço</option>
          <option value="nota">Ordenar por Avaliação</option>
        </select>
      </div>
    </header>

    <main classNameName="p-4 lg:p-15">
        <div className="grid lg:grid-cols-4 gap-4">
            
        </div>
    </main>

    <script src="index.js"></script>
  </body>
</html>
