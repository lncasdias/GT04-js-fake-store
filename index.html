<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Fake Store</title>
  </head>
  <body>
    <header class="flex items-center justify-between px-15 py-4 bg-[#060608]">
      <div>
        <input
          type="text"
          placeholder="Digite o nome do produto"
          class="w-120 h-10 rounded bg-white pl-4"
        />
      </div>
      <div>
        <select id="categorias" class="h-10 rounded bg-white pl-4">
          <option>Men's clothing</option>
          <option>Women's clothing</option>
          <option>Electronics</option>
          <option>Jewelry</option>
        </select>
        <select id="ordenacao" class="h-10 rounded bg-white pl-4">
          <option value="preco">Ordenar por preço</option>
          <option value="nota">Ordenar por Avaliação</option>
        </select>
      </div>
    </header>

    <main class="p-15">
        <div id="cards" class="grid grid-cols-4 gap-4">
            <div class="bg-white rounded p-4">
                <div class="relative">
                    <img id="imagem" src="" alt="" class="w-full h-55 object-contain">
                    <div class="p-2 bg-[#f42e1f] text-white font-bold absolute top-3 right-3 rounded">4.0</div>
                </div>
                <div class="pt-4">
                <h2 id="titulo" class="font-semibold text-xl">Nome do produto</h2>
                <h6 id="categoria" class="font bold">Categoria</h6>
                <h6 class="text-right text-2xl">R$ 0.00</h6>
            </div>
            </div>
          </div>
    </main>

    <script src="index.js"></script>
  </body>
</html>
