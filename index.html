<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
    <title>Fake Store</title>
  </head>
  <body>
    <header class="flex items-center justify-between px-15 py-4 bg-[#060608]">
      <div>
        <input onkeyup="pesquisarProdutos(event.target.value)"
          type="text"
          placeholder="Digite o nome do produto"
          class="w-120 h-10 rounded bg-white pl-4"
        />
      </div>
      <div>
        <select id="categorias" onchange="filtrarPorCategoria(event.target.value)" class="h-10 rounded bg-white pl-4">
          <option selected disabled>Filtrar produtos</option>
          <option>All</option>
          <option>Men's clothing</option>
          <option>Women's clothing</option>
          <option>Electronics</option>
          <option>Jewelery</option>
        </select>
        <select id="ordenacao" onchange="ordenarProdutos(event.target.value)" class="h-10 rounded bg-white pl-4">
          <option selected disabled>Ordenar produtos</option>
          <option value="maiorPreco">Ordenar por maior preço</option>
          <option value="menorPreco">Ordenar por menor preço</option>
          <option value="nota">Ordenar por Avaliação</option>
        </select>
      </div>
    </header>

    <main class="p-15">
        <div id="cards" class="grid grid-cols-4 gap-4">
            
          </div>
    </main>

    <script src="index.js"></script>
  </body>
</html>
